# -- Container image. `repository` is required at install time (e.g. via -f overrides).
image:
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -- Replica count for the API Deployment.
replicaCount: 1

# -- Name of an existing Kubernetes Secret containing SHELF_* environment
# variables. The Secret is mounted via envFrom on both the api Deployment
# and the migration Job. Required keys at minimum:
#   SHELF_DATABASE_URL
#   SHELF_SESSION_SECRET_KEY
# Optional:
#   SHELF_REDIS_URL, SHELF_S3_ENDPOINT, SHELF_S3_ENDPOINT_PUBLIC,
#   SHELF_S3_REGION, SHELF_S3_BUCKET,
#   SHELF_S3_ACCESS_KEY_ID, SHELF_S3_SECRET_ACCESS_KEY,
#   SHELF_GOTENBERG_URL, SHELF_DEV_LOGIN_ENABLED, SHELF_CORS_ORIGINS,
#   SHELF_PREFLIGHT_ENABLED, SHELF_FRAME_ANCESTORS
existingSecretName: ""

# -- Extra environment variables, appended after envFrom (these win on conflict).
extraEnv: []
#   - name: SHELF_CORS_ORIGINS
#     value: '["https://shelf.example.com"]'

# -- Pages allowed to embed shelf in an iframe, as CSP source expressions,
# passed to the app as SHELF_FRAME_ANCESTORS. Set, HTML responses carry
# `Content-Security-Policy: frame-ancestors <list>`; empty (the default)
# sends no framing header, so any page may frame shelf. `'self'` is not
# implied. See DEVELOPERS.md, "Embedding".
frameAncestors: []
#   - "'self'"
#   - https://viewer.example.com

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #   - host: shelf.example.com
  #     paths:
  #       - path: /
  #         pathType: Prefix
  tls: []
  #   - secretName: shelf-tls
  #     hosts: ["shelf.example.com"]

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# -- Run `alembic upgrade head` as a Helm pre-install / pre-upgrade Job.
migrations:
  enabled: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}

# -- Background extraction worker (PDF body text → tsvector).
# Subscribes to a NATS JetStream subject and updates attachment rows
# in-place. Disable to skip running the worker (e.g. when nats.url is
# not yet provisioned); the API still works and rows stay `pending`,
# the backfill script can pick them up later.
worker:
  enabled: true
  replicas: 1
  # Resources are set for the combined extract + ocr + outline + convert
  # consumers (office conversion itself runs in the gotenberg pod below). OCR
  # via Tesseract is the heavier of the two (one 1-2 GB working set
  # per page in flight); the limits here cover a reasonable book-
  # length scan without thrashing. Bump if you ingest huge scans.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 3Gi

# -- Gotenberg (LibreOffice behind an HTTP API) for the worker's `convert`
# consumer, which renders Word, PowerPoint and spreadsheet uploads to PDF.
# Images are converted in the worker itself and don't need it. Enabled, the
# chart runs it beside the worker and points SHELF_GOTENBERG_URL at it;
# disable to bring your own (set SHELF_GOTENBERG_URL in the Secret or
# extraEnv) or to go without office conversion — those uploads then show
# "conversion failed" and stay downloadable.
gotenberg:
  enabled: true
  image:
    repository: gotenberg/gotenberg
    tag: "8"
    pullPolicy: IfNotPresent
  # LibreOffice holds a few hundred MB idle and spikes on large decks and
  # spreadsheets; one conversion at a time is what the worker sends.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1536Mi

# -- External NATS endpoint. Empty disables job publishing on the API
# side and prevents the worker from starting (it exits with a clear
# error). Format: nats://host:port. There's no NATS embedded in this
# chart — point this at your shared nats namespace.
nats:
  url: ""
